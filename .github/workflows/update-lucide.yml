name: Update Lucide Icons

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: Regenerate icons even if the version is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-icons:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Lucide version from GitHub releases
        id: lucide_latest
        run: |
          LATEST=$(curl -sI https://github.com/lucide-icons/lucide/releases/latest \
            | grep -i "^location:" \
            | sed 's/.*\/tag\///' \
            | tr -d '[:space:]')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Detected version: $LATEST"

      - name: Read current tracked version
        id: lucide_current
        run: |
          CURRENT=$(cat lucide-version.txt 2>/dev/null || echo "0.0.0")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: version_check
        env:
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
        run: |
          LATEST="${{ steps.lucide_latest.outputs.version }}"
          CURRENT="${{ steps.lucide_current.outputs.version }}"
          echo "Latest:  $LATEST"
          echo "Current: $CURRENT"
          if [ "$LATEST" != "$CURRENT" ] || [ "$FORCE_REGENERATE" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Lucide icons zip
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.lucide_latest.outputs.version }}"
          curl -L \
            "https://github.com/lucide-icons/lucide/releases/download/${VERSION}/lucide-icons-${VERSION}.zip" \
            -o lucide-icons.zip

      - name: Unzip and clean icons
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          unzip -o lucide-icons.zip -d lucide-icons-raw
          # remove json files, keep only SVGs
          find lucide-icons-raw -name "*.json" -delete
          rm lucide-icons.zip

      - name: Set up Node.js
        if: steps.version_check.outputs.needs_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install svgo
        if: steps.version_check.outputs.needs_update == 'true'
        run: npm install -g svgo

      - name: Preserve SVG fill semantics
        if: steps.version_check.outputs.needs_update == 'true'
        run: python3 .github/scripts/prepare-lucide-svgs.py ./lucide-icons-raw/icons

      - name: Clear previous generated icon sources
        if: steps.version_check.outputs.needs_update == 'true'
        run: rm -rf ./icons/src/commonMain/kotlin/generated

      - name: Install s2c via Homebrew
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          brew tap dev-tonholo/svg-to-compose
          brew trust dev-tonholo/svg-to-compose
          brew install s2c

      - name: Convert SVGs to Compose ImageVectors
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          s2c \
            -o ./icons/src/commonMain/kotlin/generated/icons \
            -p com.shipsco.lucide_compose \
            -t com.shipsco.lucide_compose.Lucide \
            -opt true \
            -rt Lucide \
            --no-preview \
            --kmp=true \
            ./lucide-icons-raw/icons

      - name: Convert case-colliding icons
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          collision_index=0
          for icon in ./lucide-icons-raw/icon-name-collisions/*/*.svg; do
            if [ ! -f "$icon" ]; then
              continue
            fi
            collision_index=$((collision_index + 1))
            icon_name="$(basename "$icon" .svg)"
            temporary_output="./lucide-icons-raw/generated/$icon_name"
            s2c \
              -o "$temporary_output" \
              -p com.shipsco.lucide_compose \
              -t com.shipsco.lucide_compose.Lucide \
              -opt true \
              -rt Lucide \
              --no-preview \
              --kmp=true \
              "$icon"
            generated_file="$(find "$temporary_output" -type f -name "*.kt" -print -quit)"
            mkdir -p ./icons/src/commonMain/kotlin/generated/case-collisions
            mv "$generated_file" \
              "./icons/src/commonMain/kotlin/generated/case-collisions/LucideCaseCollision${collision_index}.kt"
          done

      - name: Clean up downloaded icons
        if: steps.version_check.outputs.needs_update == 'true'
        run: rm -rf lucide-icons-raw

      - name: Update tracked version file
        if: steps.version_check.outputs.needs_update == 'true'
        run: echo "${{ steps.lucide_latest.outputs.version }}" > lucide-version.txt

      - name: Create Pull Request
        if: steps.version_check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Lucide icons to ${{ steps.lucide_latest.outputs.version }}"
          branch: "lucide-update/${{ steps.lucide_latest.outputs.version }}"
          title: "chore: update Lucide icons to ${{ steps.lucide_latest.outputs.version }}"
          body: |
            Automated update of Lucide Icons.

            - **Previous version:** `${{ steps.lucide_current.outputs.version }}`
            - **New version:** `${{ steps.lucide_latest.outputs.version }}`

            Lucide changelog: https://github.com/lucide-icons/lucide/releases/tag/${{ steps.lucide_latest.outputs.version }}
          labels: dependencies, automated
